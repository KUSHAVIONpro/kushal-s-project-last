<!DOCTYPE html>
<html lang="hi">
<head>
<link rel="manifest" href="manifest.json">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>KUSHAL'S AI - MP Board Class 10 Maths</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap');
  
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }
  
  body {
    font-family: 'Poppins', 'Noto Sans Devanagari', sans-serif;
    background: #0d0d12;
    color: #e0e0e0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  
  /* Header */
  .header {
    background: linear-gradient(180deg, #1a1a2e 0%, #12121a 100%);
    padding: 12px 16px 8px;
    border-bottom: 1px solid #2a2a3a;
    position: relative;
    z-index: 10;
  }
  
  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 8px;
  }
  
  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .menu-btn, .icon-btn {
    background: none;
    border: none;
    color: #aaa;
    font-size: 20px;
    cursor: pointer;
    padding: 4px;
  }
  
  .brand {
    font-size: 16px;
    font-weight: 600;
    color: #fff;
    letter-spacing: 0.5px;
  }
  
  .header-right {
    display: flex;
    gap: 8px;
  }
  
  .logo-section {
    text-align: center;
    padding: 8px 0 4px;
  }
  
  .logo-main {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  
  .logo-icon {
    font-size: 28px;
    filter: drop-shadow(0 0 8px #00f0ff);
  }
  
  .logo-text {
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #00f0ff, #00a8ff, #7b5cff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: 0 0 20px rgba(0, 240, 255, 0.5);
    letter-spacing: 1px;
  }
  
  .tagline {
    font-size: 12px;
    color: #888;
    letter-spacing: 1px;
  }
  
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 6px;
    font-size: 12px;
    color: #00e676;
  }
  
  .status-dot {
    width: 8px;
    height: 8px;
    background: #00e676;
    border-radius: 50%;
    animation: pulse 1.5s infinite;
  }
  
  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.6; transform: scale(1.2); }
  }
  
  /* Chat Area */
  .chat-container {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }
  
  .message {
    max-width: 92%;
    padding: 12px 16px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    animation: fadeIn 0.3s ease;
  }
  
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  
  .bot-msg {
    background: #1e1e2e;
    border: 1px solid #2a2a3e;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  
  .user-msg {
    background: linear-gradient(135deg, #1a3a5c, #0d2b4a);
    border: 1px solid #2a5a8a;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  
  .welcome-card {
    background: linear-gradient(145deg, #1a1a2e, #151525);
    border: 1px solid #2a2a4a;
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 8px;
  }
  
  .welcome-title {
    font-size: 18px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #fff;
  }
  
  .welcome-sub {
    color: #aaa;
    margin-bottom: 16px;
    font-size: 14px;
  }
  
  .feature-list {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .feature-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.2s;
    font-size: 14px;
  }
  
  .feature-item:hover, .feature-item:active {
    background: rgba(0, 240, 255, 0.1);
  }
  
  .feature-icon {
    font-size: 18px;
    width: 28px;
    text-align: center;
  }
  
  .math-content {
    font-family: 'Poppins', 'Noto Sans Devanagari', monospace;
  }
  
  .math-content h3 {
    color: #00f0ff;
    margin: 10px 0 6px;
    font-size: 15px;
  }
  
  .math-content h4 {
    color: #7b5cff;
    margin: 8px 0 4px;
    font-size: 14px;
  }
  
  .math-content p, .math-content li {
    margin: 4px 0;
    line-height: 1.6;
  }
  
  .math-content ul, .math-content ol {
    padding-left: 20px;
    margin: 6px 0;
  }
  
  .formula-box {
    background: #12121c;
    border: 1px solid #333;
    border-left: 3px solid #00f0ff;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 8px;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    overflow-x: auto;
  }
  
  .example-box {
    background: #1a2a1a;
    border: 1px solid #2a4a2a;
    border-left: 3px solid #00e676;
    padding: 10px 14px;
    margin: 8px 0;
    border-radius: 8px;
  }
  
  .note-box {
    background: #2a1a1a;
    border: 1px solid #4a2a2a;
    border-left: 3px solid #ff6b6b;
    padding: 8px 12px;
    margin: 8px 0;
    border-radius: 8px;
    font-size: 13px;
  }
  
  .chapter-btn {
    display: inline-block;
    background: #1a2a3a;
    border: 1px solid #2a4a6a;
    color: #7ec8ff;
    padding: 6px 12px;
    border-radius: 20px;
    margin: 4px;
    font-size: 12px;
    cursor: pointer;
  }
  
  .chapter-btn:hover {
    background: #2a3a5a;
  }
  
  /* Input Area */
  .input-area {
    background: #12121a;
    border-top: 1px solid #2a2a3a;
    padding: 12px 14px 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .quick-actions {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
    scrollbar-width: none;
  }
  
  .quick-actions::-webkit-scrollbar { display: none; }
  
  .quick-btn {
    flex-shrink: 0;
    background: #1e1e2e;
    border: 1px solid #333;
    color: #ccc;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 12px;
    cursor: pointer;
    white-space: nowrap;
  }
  
  .quick-btn:active {
    background: #2a2a4a;
    border-color: #00f0ff;
  }
  
  .input-row {
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .input-box {
    flex: 1;
    background: #1a1a28;
    border: 1.5px solid #2a2a4a;
    border-radius: 24px;
    padding: 12px 18px;
    color: #fff;
    font-size: 14px;
    outline: none;
    font-family: inherit;
  }
  
  .input-box:focus {
    border-color: #00f0ff;
    box-shadow: 0 0 0 2px rgba(0, 240, 255, 0.15);
  }
  
  .input-box::placeholder {
    color: #666;
  }
  
  .mic-btn, .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.15s;
  }
  
  .mic-btn {
    background: #1e1e2e;
    color: #00f0ff;
    border: 1px solid #2a2a4a;
  }
  
  .mic-btn.listening {
    background: #ff3b3b;
    color: #fff;
    animation: pulse-red 1s infinite;
  }
  
  @keyframes pulse-red {
    0%, 100% { box-shadow: 0 0 0 0 rgba(255, 59, 59, 0.5); }
    50% { box-shadow: 0 0 0 10px rgba(255, 59, 59, 0); }
  }
  
  .send-btn {
    background: linear-gradient(135deg, #00c6ff, #0072ff);
    color: #fff;
  }
  
  .mic-btn:active, .send-btn:active {
    transform: scale(0.92);
  }
  
  .status-bar {
    text-align: center;
    font-size: 11px;
    color: #555;
    padding: 2px;
  }
  
  /* Sidebar */
  .sidebar {
    position: fixed;
    top: 0;
    left: -280px;
    width: 280px;
    height: 100%;
    background: #12121c;
    border-right: 1px solid #2a2a3a;
    z-index: 100;
    transition: left 0.3s ease;
    overflow-y: auto;
    padding: 20px 0;
  }
  
  .sidebar.open {
    left: 0;
  }
  
  .sidebar-header {
    padding: 0 20px 16px;
    border-bottom: 1px solid #2a2a3a;
    margin-bottom: 12px;
  }
  
  .sidebar-title {
    font-size: 16px;
    font-weight: 600;
    color: #00f0ff;
  }
  
  .sidebar-item {
    padding: 12px 20px;
    cursor: pointer;
    font-size: 14px;
    color: #ccc;
    display: flex;
    align-items: center;
    gap: 10px;
  }
  
  .sidebar-item:hover, .sidebar-item:active {
    background: rgba(0, 240, 255, 0.08);
    color: #fff;
  }
  
  .overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.6);
    z-index: 99;
    display: none;
  }
  
  .overlay.show {
    display: block;
  }
  
  /* Loading */
  .typing {
    display: flex;
    gap: 4px;
    padding: 8px 0;
  }
  
  .typing span {
    width: 8px;
    height: 8px;
    background: #00f0ff;
    border-radius: 50%;
    animation: bounce 1.2s infinite;
  }
  
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }
  
  .lang-toggle {
    position: absolute;
    top: 12px;
    right: 50px;
    background: #1e1e2e;
    border: 1px solid #333;
    color: #aaa;
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 11px;
    cursor: pointer;
  }
  
  pre {
    white-space: pre-wrap;
    word-break: break-word;
    font-family: 'Courier New', monospace;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="overlay" id="overlay" onclick="closeSidebar()"></div>

<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-title">⚡ KUSHAL'S AI</div>
    <div style="font-size:12px;color:#666;margin-top:4px;">MP Board Class 10 Maths</div>
  </div>
  <div class="sidebar-item" onclick="quickAction('chapters')">📚 All Chapters</div>
  <div class="sidebar-item" onclick="quickAction('formulas')">📐 All Formulas</div>
  <div class="sidebar-item" onclick="quickAction('definitions')">📖 Definitions</div>
  <div class="sidebar-item" onclick="quickAction('theorems')">📏 Theorems</div>
  <div class="sidebar-item" onclick="quickAction('solver')">✏️ Problem Solver</div>
  <div class="sidebar-item" onclick="quickAction('trig')">📐 Trigonometry</div>
  <div class="sidebar-item" onclick="quickAction('quadratic')">🔢 Quadratic Equations</div>
  <div class="sidebar-item" onclick="quickAction('help')">❓ How to use</div>
  <div class="sidebar-item" onclick="clearChat()">🗑️ Clear Chat</div>
</div>

<div class="header">
  <div class="header-top">
    <div class="header-left">
      <button class="menu-btn" onclick="toggleSidebar()">☰</button>
      <span class="brand">KUSHAL'S AI</span>
    </div>
    <div class="header-right">
      <button class="lang-toggle" id="langBtn" onclick="toggleLang()">हिंदी / EN</button>
      <button class="icon-btn">✕</button>
    </div>
  </div>
  <div class="logo-section">
    <div class="logo-main">
      <span class="logo-icon">⚡</span>
      <span class="logo-text">KUSHAL'S AI</span>
    </div>
    <div class="tagline">Voice • Maths • Smart Assistant</div>
    <div class="status">
      <span class="status-dot"></span>
      <span>AI Ready</span>
    </div>
  </div>
</div>

<div class="chat-container" id="chatBox">
  <!-- Welcome will be injected -->
</div>

<div class="input-area">
  <div class="quick-actions">
    <button class="quick-btn" onclick="quickAction('chapters')">📚 Chapters</button>
    <button class="quick-btn" onclick="quickAction('formulas')">📐 Formula</button>
    <button class="quick-btn" onclick="quickAction('definitions')">📖 Definition</button>
    <button class="quick-btn" onclick="quickAction('theorems')">📏 Theorem</button>
    <button class="quick-btn" onclick="quickAction('solver')">✏️ Solver</button>
    <button class="quick-btn" onclick="quickAction('trig')">sin cos tan</button>
  </div>
  <div class="input-row">
    <input type="text" class="input-box" id="userInput" placeholder="Type your question... / सवाल टाइप करो..." autocomplete="off">
    <button class="mic-btn" id="micBtn" onclick="toggleVoice()">🎤</button>
    <button class="send-btn" onclick="sendMessage()">➤</button>
  </div>
  <div class="status-bar" id="statusBar">Question type karo ya mic dabakar bolo</div>
</div>

<script>
// ==================== LANGUAGE ====================
let lang = 'hi'; // 'hi' or 'en'

function toggleLang() {
  lang = lang === 'hi' ? 'en' : 'hi';
  document.getElementById('langBtn').textContent = lang === 'hi' ? 'हिंदी / EN' : 'EN / हिंदी';
  document.getElementById('statusBar').textContent = lang === 'hi' 
    ? 'Question type karo ya mic dabakar bolo' 
    : 'Type your question or press mic to speak';
  showWelcome();
}

// ==================== KNOWLEDGE BASE ====================
const knowledge = {
  chapters: {
    hi: [
      "1. वास्तविक संख्याएँ (Real Numbers)",
      "2. बहुपद (Polynomials)",
      "3. दो चर वाले रैखिक समीकरण युग्म (Pair of Linear Equations)",
      "4. द्विघात समीकरण (Quadratic Equations)",
      "5. समांतर श्रेढ़ियाँ (Arithmetic Progressions)",
      "6. त्रिभुज (Triangles)",
      "7. निर्देशांक ज्यामिति (Coordinate Geometry)",
      "8. त्रिकोणमिति का परिचय (Introduction to Trigonometry)",
      "9. त्रिकोणमिति के कुछ अनुप्रयोग (Applications of Trigonometry)",
      "10. वृत्त (Circles)",
      "11. वृतों से संबंधित क्षेत्रफल (Areas Related to Circles)",
      "12. पृष्ठीय क्षेत्रफल और आयतन (Surface Areas and Volumes)",
      "13. सांख्यिकी (Statistics)",
      "14. प्रायिकता (Probability)"
    ],
    en: [
      "1. Real Numbers",
      "2. Polynomials",
      "3. Pair of Linear Equations in Two Variables",
      "4. Quadratic Equations",
      "5. Arithmetic Progressions",
      "6. Triangles",
      "7. Coordinate Geometry",
      "8. Introduction to Trigonometry",
      "9. Some Applications of Trigonometry",
      "10. Circles",
      "11. Areas Related to Circles",
      "12. Surface Areas and Volumes",
      "13. Statistics",
      "14. Probability"
    ]
  },
  
  formulas: {
    "real numbers": {
      hi: `<h3>📐 वास्तविक संख्याएँ - सूत्र</h3>
<div class="formula-box">HCF(a,b) × LCM(a,b) = a × b</div>
<div class="formula-box">यूक्लिड विभाजन प्रमेयिका: a = bq + r (जहाँ 0 ≤ r < b)</div>
<p><b>मौलिक प्रमेय:</b> हर समग्र संख्या को अभाज्य संख्याओं के गुणनफल के रूप में लिखा जा सकता है।</p>`,
      en: `<h3>📐 Real Numbers - Formulas</h3>
<div class="formula-box">HCF(a,b) × LCM(a,b) = a × b</div>
<div class="formula-box">Euclid's Division Lemma: a = bq + r (where 0 ≤ r < b)</div>
<p><b>Fundamental Theorem:</b> Every composite number can be expressed as product of primes.</p>`
    },
    "polynomials": {
      hi: `<h3>📐 बहुपद - सूत्र</h3>
<div class="formula-box">द्विघात बहुपद ax² + bx + c के लिए:<br>
α + β = -b/a<br>
αβ = c/a</div>
<p>शून्यक (zeros) वे मान हैं जहाँ p(x) = 0</p>`,
      en: `<h3>📐 Polynomials - Formulas</h3>
<div class="formula-box">For quadratic ax² + bx + c:<br>
α + β = -b/a<br>
αβ = c/a</div>
<p>Zeros are values where p(x) = 0</p>`
    },
    "quadratic": {
      hi: `<h3>📐 द्विघात समीकरण - सूत्र</h3>
<div class="formula-box">ax² + bx + c = 0</div>
<div class="formula-box">x = [-b ± √(b² - 4ac)] / 2a</div>
<div class="formula-box">विविक्तकर D = b² - 4ac</div>
<ul>
<li>D > 0 → दो भिन्न वास्तविक मूल</li>
<li>D = 0 → दो समान वास्तविक मूल</li>
<li>D < 0 → कोई वास्तविक मूल नहीं</li>
</ul>`,
      en: `<h3>📐 Quadratic Equations - Formulas</h3>
<div class="formula-box">ax² + bx + c = 0</div>
<div class="formula-box">x = [-b ± √(b² - 4ac)] / 2a</div>
<div class="formula-box">Discriminant D = b² - 4ac</div>
<ul>
<li>D > 0 → Two distinct real roots</li>
<li>D = 0 → Two equal real roots</li>
<li>D < 0 → No real roots</li>
</ul>`
    },
    "ap": {
      hi: `<h3>📐 समांतर श्रेढ़ी (AP) - सूत्र</h3>
<div class="formula-box">nवाँ पद: aₙ = a + (n-1)d</div>
<div class="formula-box">n पदों का योग: Sₙ = n/2 [2a + (n-1)d]</div>
<div class="formula-box">Sₙ = n/2 (a + l)  (जहाँ l अंतिम पद)</div>`,
      en: `<h3>📐 Arithmetic Progression - Formulas</h3>
<div class="formula-box">nth term: aₙ = a + (n-1)d</div>
<div class="formula-box">Sum of n terms: Sₙ = n/2 [2a + (n-1)d]</div>
<div class="formula-box">Sₙ = n/2 (a + l)  (where l is last term)</div>`
    },
    "trigonometry": {
      hi: `<h3>📐 त्रिकोणमिति - सूत्र</h3>
<div class="formula-box">
sin θ = लम्ब / कर्ण (P/H)<br>
cos θ = आधार / कर्ण (B/H)<br>
tan θ = लम्ब / आधार (P/B)<br>
cosec θ = 1/sin θ<br>
sec θ = 1/cos θ<br>
cot θ = 1/tan θ
</div>
<div class="formula-box">
sin²θ + cos²θ = 1<br>
1 + tan²θ = sec²θ<br>
1 + cot²θ = cosec²θ
</div>
<div class="formula-box">
sin(90°-θ) = cos θ<br>
cos(90°-θ) = sin θ<br>
tan(90°-θ) = cot θ
</div>
<p><b>मान:</b></p>
<div class="formula-box">
sin 0°=0, sin 30°=1/2, sin 45°=1/√2, sin 60°=√3/2, sin 90°=1<br>
cos 0°=1, cos 30°=√3/2, cos 45°=1/√2, cos 60°=1/2, cos 90°=0<br>
tan 0°=0, tan 30°=1/√3, tan 45°=1, tan 60°=√3, tan 90°=अपरिभाषित
</div>`,
      en: `<h3>📐 Trigonometry - Formulas</h3>
<div class="formula-box">
sin θ = Opposite / Hypotenuse<br>
cos θ = Adjacent / Hypotenuse<br>
tan θ = Opposite / Adjacent<br>
cosec θ = 1/sin θ<br>
sec θ = 1/cos θ<br>
cot θ = 1/tan θ
</div>
<div class="formula-box">
sin²θ + cos²θ = 1<br>
1 + tan²θ = sec²θ<br>
1 + cot²θ = cosec²θ
</div>
<div class="formula-box">
sin(90°-θ) = cos θ<br>
cos(90°-θ) = sin θ<br>
tan(90°-θ) = cot θ
</div>
<p><b>Standard Values:</b></p>

  document.getElementById('sidebar').classList.remove('open');

function addMessage(html, isUser = false) {
  const chat = document.getElementById('chatBox');
  const div = document.createElement('div');
  div.className = 'message ' + (isUser ? 'user-msg' : 'bot-msg');
  div.innerHTML = html;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

}

// ==================== CORE AI LOGIC ====================
function processQuery(query) {
  const q = query.toLowerCase().trim();
  const isHindi = /[\u0900-\u097F]/.test(query) || lang === 'hi';
  
  // === CHAPTERS ===
  if (q.includes('chapter') || q.includes('अध्याय') || q.includes('sab chapter') || q.includes('all chapter') || q.includes('syllabus') || q.includes('सिलेबस')) {
    const list = knowledge.chapters[isHindi ? 'hi' : 'en'];
    let html = `<div class="math-content"><h3>📚 MP Board Class 10 Maths Chapters</h3><ol style="padding-left:20px;">`;
    list.forEach(c => html += `<li style="margin:6px 0;">${c}</li>`);
    html += `</ol><p style="margin-top:12px;color:#888;">किसी chapter का नाम लिखो जैसे "Quadratic Equations" या "द्विघात समीकरण"</p></div>`;
    return html;
  }
  
  // === ALL FORMULAS ===
  if ((q.includes('formula') || q.includes('सूत्र') || q.includes('sutra') || q.includes('सभी')) && 
      (q.includes('all') || q.includes('sab') || q.includes('important') || q.includes('महत्वपूर्ण') || q.length < 25)) {
    let html = `<div class="math-content"><h3>📐 Important Formulas - Class 10 Maths</h3>`;

    html += knowledge.formulas.statistics[isHindi?'hi':'en'];
    html += knowledge.formulas.probability[isHindi?'hi':'en'];
    html += `</div>`;
    return html;
  }
  
  // === THEOREMS ===
  if (q.includes('theorem') || q.includes('प्रमेय') || q.includes('pramey')) {
    return `<div class="math-content">${knowledge.theorems[isHindi?'hi':'en']}</div>`;
  }
  
  // === DEFINITIONS LIST ===
  if (q.includes('definition') || q.includes('परिभाषा') || q.includes('paribhasha')) {
    let html = `<div class="math-content"><h3>📖 Important Definitions</h3>
    <p>निम्नलिखित में से कोई भी पूछ सकते हो:</p>
    <ul>
      <li>Real Number / वास्तविक संख्या</li>
      <li>Polynomial / बहुपद</li>
      <li>Quadratic Equation / द्विघात समीकरण</li>
      <li>Arithmetic Progression / समांतर श्रेढ़ी</li>
      <li>Similar Triangles / समरूप त्रिभुज</li>
      <li>Probability / प्रायिकता</li>
    </ul>
    <p style="color:#888;margin-top:10px;">उदाहरण: "द्विघात समीकरण क्या है?"</p></div>`;
    return html;
  }
  
  // === TRIG VALUES ===
  const sinMatch = q.match(/sin\s*(\d+)/);
  const cosMatch = q.match(/cos\s*(\d+)/);
  const tanMatch = q.match(/tan\s*(\d+)/);
  
  if (sinMatch || cosMatch || tanMatch) {
    const angle = parseInt((sinMatch || cosMatch || tanMatch)[1]);
    const val = trigValues[angle];
    if (val) {
      let html = `<div class="math-content"><h3>📐 Trigonometric Values</h3>`;
      if (sinMatch) html += `<div class="formula-box">sin ${angle}° = ${val.sin}</div>`;
      if (cosMatch) html += `<div class="formula-box">cos ${angle}° = ${val.cos}</div>`;
      if (tanMatch) html += `<div class="formula-box">tan ${angle}° = ${val.tan}</div>`;
      html += `<p style="margin-top:10px;">Standard angles: 0°, 30°, 45°, 60°, 90°</p></div>`;
      return html;
    }
  }
  
  if (q.includes('trig') || q.includes('त्रिकोणमिति') || q.includes('trigonometry') || q.includes('sin cos') || q.includes('सूत्र') && q.includes('त्रि')) {
    return `<div class="math-content">${knowledge.formulas.trigonometry[isHindi?'hi':'en']}</div>`;
  }
  
  // === SPECIFIC TOPICS ===
  if (q.includes('quadratic') || q.includes('द्विघात') || q.includes('dwighat')) {
    let html = `<div class="math-content">`;
    html += knowledge.definitions["quadratic equation"][isHindi?'hi':'en'];
    html += knowledge.formulas.quadratic[isHindi?'hi':'en'];
    html += `<div class="example-box"><b>उदाहरण / Example:</b><br>
    x² - 5x + 6 = 0<br>

    D = 25-24=1 > 0 → दो वास्तविक मूल</div></div>`;
    return html;
  }
  
  if (q.includes('polynomial') || q.includes('बहुपद') || q.includes('bahupad')) {
    return `<div class="math-content">${knowledge.definitions.polynomial[isHindi?'hi':'en']}${knowledge.formulas.polynomials[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('real number') || q.includes('वास्तविक') || q.includes('hcf') || q.includes('lcm')) {
    return `<div class="math-content">${knowledge.definitions["real number"][isHindi?'hi':'en']}${knowledge.formulas["real numbers"][isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('arithmetic') || q.includes('समांतर') || q.includes('ap ') || q.includes('a.p') || q.includes('श्रेढ़ी')) {
    return `<div class="math-content">${knowledge.definitions["arithmetic progression"][isHindi?'hi':'en']}${knowledge.formulas.ap[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('coordinate') || q.includes('निर्देशांक') || q.includes('distance formula') || q.includes('दूरी सूत्र')) {
    return `<div class="math-content">${knowledge.formulas.coordinate[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('circle') || q.includes('वृत्त') || q.includes('vritt')) {
    return `<div class="math-content">${knowledge.formulas.circles[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('surface') || q.includes('volume') || q.includes('पृष्ठीय') || q.includes('आयतन') || q.includes('cylinder') || q.includes('cone') || q.includes('sphere') || q.includes('बेलन') || q.includes('शंकु') || q.includes('गोला')) {

  }
  
  if (q.includes('statistic') || q.includes('सांख्यिकी') || q.includes('mean') || q.includes('median') || q.includes('mode') || q.includes('माध्य') || q.includes('माध्यिका') || q.includes('बहुलक')) {

  if (q.includes('probability') || q.includes('प्रायिकता') || q.includes('prayikta')) {
    return `<div class="math-content">${knowledge.definitions.probability[isHindi?'hi':'en']}${knowledge.formulas.probability[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('linear equation') || q.includes('रैखिक') || q.includes('pair of linear')) {
    return `<div class="math-content">${knowledge.formulas.linear[isHindi?'hi':'en']}</div>`;
  }
  
  if (q.includes('triangle') || q.includes('त्रिभुज') || q.includes('similar') || q.includes('समरूप') || q.includes('pythagoras') || q.includes('पाइथागोरस')) {
    return `<div class="math-content">${knowledge.formulas.triangles[isHindi?'hi':'en']}</div>`;
  }
  
  // === CALCULATOR / ARITHMETIC ===
  const calcMatch = q.match(/([\d.]+)\s*([+\-×x*\/÷])\s*([\d.]+)/);
  if (calcMatch) {
    let a = parseFloat(calcMatch[1]);
    let op = calcMatch[2];
    let b = parseFloat(calcMatch[3]);
    let result;
    if (op === '+' ) result = a + b;
    else if (op === '-') result = a - b;
    else if (op === '×' || op === 'x' || op === '*') result = a * b;
    else if (op === '/' || op === '÷') result = b !== 0 ? a / b : 'Undefined (division by zero)';
    return `<div class="math-content"><h3>🔢 Calculation</h3>
    <div class="formula-box">${a} ${op} ${b} = <b>${result}</b></div></div>`;
  }
  
  // Simple power
  const powMatch = q.match(/([\d.]+)\s*\^\s*([\d.]+)/) || q.match(/([\d.]+)\s*की\s*([\d.]+)\s*घात/);
  if (powMatch) {
    const res = Math.pow(parseFloat(powMatch[1]), parseFloat(powMatch[2]));
    return `<div class="math-content"><div class="formula-box">${powMatch[1]} ^ ${powMatch[2]} = <b>${res}</b></div></div>`;
  }
  
  // Square root
  const sqrtMatch = q.match(/√\s*([\d.]+)/) || q.match(/square root of ([\d.]+)/) || q.match(/([\d.]+)\s*का\s*वर्गमूल/);
  if (sqrtMatch) {
    const res = Math.sqrt(parseFloat(sqrtMatch[1]));
    return `<div class="math-content"><div class="formula-box">√${sqrtMatch[1]} = <b>${res}</b></div></div>`;
  }
  
  // === QUADRATIC SOLVER ===
  const quadMatch = q.match(/([-\d.]+)x\s*\^?\s*2\s*([+-]\s*[\d.]+)x\s*([+-]\s*[\d.]+)\s*=\s*0/i) ||
                    q.match(/solve\s*([-\d.]+)x²\s*([+-][\d.]+)x\s*([+-][\d.]+)/i);
  if (quadMatch || (q.includes('solve') && q.includes('x'))) {
    // Try to extract coefficients
    let a=1, b=0, c=0;
    const nums = q.match(/([+-]?\d*\.?\d+)\s*x\s*\²?|([+-]?\d*\.?\d+)\s*x|([+-]?\d+\.?\d*)/g);
    // Simple known examples
    if (q.includes('x2') || q.includes('x²') || q.includes('x^2')) {
      return `<div class="math-content"><h3>✏️ Quadratic Solver</h3>
      <p>समस्या इस फॉर्म में लिखो:</p>
      <div class="formula-box">ax² + bx + c = 0</div>
      <p>उदाहरण: <b>x² - 5x + 6 = 0</b> या <b>2x² + 3x - 2 = 0</b></p>
      <p style="color:#888;">मैं discriminant निकालकर मूल बता दूँगा।</p></div>`;
    }
  }
  
  // Specific quadratic examples
  if (q.includes('x² - 5x + 6') || q.includes('x2 - 5x + 6') || q.includes('x^2 - 5x + 6')) {
    return `<div class="math-content"><h3>✏️ Solution</h3>
    <div class="formula-box">x² - 5x + 6 = 0</div>
    <p><b>Step 1:</b> Factorisation<br>(x - 2)(x - 3) = 0</p>
    <p><b>Step 2:</b> x - 2 = 0 या x - 3 = 0</p>
    <div class="formula-box">x = 2  या  x = 3</div>
    <p><b>Check with formula:</b><br>
    a=1, b=-5, c=6<br>
    D = 25 - 24 = 1<br>
    x = [5 ± 1]/2 → x=3 या x=2</p></div>`;
  }
  
  // === HELP / WHAT CAN YOU DO ===
  if (q.includes('help') || q.includes('मदद') || q.includes('kya kar') || q.includes('what can') || q.includes('kaise use') || q.includes('solver') || q.includes('voice')) {
    return `<div class="math-content"><h3>🤖 KUSHAL'S AI - Help</h3>
    <p>मैं MP Board Class 10 Maths का पूरा expert हूँ!</p>
    <h4>मैं क्या कर सकता हूँ:</h4>
    <ul>
      <li>📚 सभी 14 chapters की जानकारी</li>
      <li>📐 सभी महत्वपूर्ण सूत्र (Formulas)</li>
      <li>📖 परिभाषाएँ (Definitions)</li>
      <li>📏 प्रमेय (Theorems)</li>
      <li>✏️ समस्याएँ हल करना (Problem Solving)</li>
      <li>🔢 गणना (Calculations)</li>

    </ul>
    <h4>उदाहरण सवाल:</h4>
    <div class="example-box">
    "द्विघात समीकरण क्या है?"<br>

    "25 × 16"<br>

  if (q.includes('hello') || q.includes('hi') || q.includes('namaste') || q.includes('नमस्ते') || q.includes('hey')) {

      ? `<div class="math-content">👋 नमस्ते! Main KUSHAL'S AI hoon.<br>MP Board Class 10 Maths के किसी भी सवाल का जवाब दे सकता हूँ।<br><br>पूछो! 😊</div>`
      : `<div class="math-content">👋 Hello! I am KUSHAL'S AI.<br>I can answer any question from MP Board Class 10 Maths.<br><br>Ask me! 😊</div>`;
  }
  
  // === DEFAULT FALLBACK ===
  return isHindi 
    ? `<div class="math-content">
        <p>🤔 मुझे सही से समझ नहीं आया।</p>
        <p>कुछ इस तरह पूछो:</p>
        <div class="example-box">
        • "द्विघात समीकरण क्या है?"<br>

// ==================== SEND MESSAGE ====================
function sendMessage() {
  const input = document.getElementById('userInput');
  const query = input.value.trim();
  if (!query) return;
  
  addMessage(query, true);
  input.value = '';
  
  showTyping();
  
  setTimeout(() => {
    hideTyping();
    const response = processQuery(query);
    addMessage(response, false);
  }, 400 + Math.random() * 400);
}

// Enter key
document.getElementById('userInput').addEventListener('keypress', function(e) {
  if (e.key === 'Enter') sendMessage();
});

// ==================== VOICE INPUT ====================
let recognition = null;
let isListening = false;

function toggleVoice() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('<div class="math-content">❌ Voice recognition is not supported in this browser. Please use Chrome or Edge.</div>', false);
    return;
  }
  
  if (isListening) {
    stopListening();
    return;
  }
  
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SpeechRecognition();
  recognition.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;
  
  recognition.onstart = () => {
    isListening = true;
    document.getElementById('micBtn').classList.add('listening');
    document.getElementById('statusBar').textContent = lang === 'hi' ? '🎤 सुन रहा हूँ... बोलो!' : '🎤 Listening... Speak now!';
  };
  
  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    document.getElementById('userInput').value = transcript;
    stopListening();
    sendMessage();
  };
  
  recognition.onerror = (event) => {
    stopListening();
    document.getElementById('statusBar').textContent = 'Error: ' + event.error;
  };
  
  recognition.onend = () => {
    stopListening();
  };
  
  recognition.start();
}

function stopListening() {
  isListening = false;
  document.getElementById('micBtn').classList.remove('listening');
  document.getElementById('statusBar').textContent = lang === 'hi' 
    ? 'Question type karo ya mic dabakar bolo' 
    : 'Type your question or press mic to speak';
  if (recognition) {
    try { recognition.stop(); } catch(e) {}
  }
}
